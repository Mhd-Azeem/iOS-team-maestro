name: Maestro backend verification
on:
  push:
    branches:
      - claude/team-maestro-exam-ios-yc6u56
    paths:
      - 'backend/**'
      - '.github/workflows/maestro-backend-checks.yml'
  pull_request:
    paths:
      - 'backend/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run check
      - name: Apply migrations to isolated local D1
        run: npx wrangler d1 migrations apply maestro-school-attendance-db --local --persist-to .wrangler/ci-d1
      - name: Assert tenant database schema
        run: |
          npx wrangler d1 execute maestro-school-attendance-db --local --persist-to .wrangler/ci-d1 --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('schools','users','sessions','students','attendance_sessions','attendance_records','school_settings');"
          npx wrangler d1 execute maestro-school-attendance-db --local --persist-to .wrangler/ci-d1 --command "PRAGMA foreign_key_check;"
