name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release'
        type: boolean
        default: false
      version:
        description: 'Version tag for the release (e.g. v1.0.0)'
        type: string
        default: 'v1.0.0'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Build IPA (signed or unsigned)
        env:
          CERT_PRESENT: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${CERT_PRESENT}" ]; then
            echo "==> Signed build"

            # ── Certificate ──────────────────────────────────────────────────
            echo "${CERT_PRESENT}" | base64 --decode > certificate.p12

            KEYCHAIN_PASS="ci-keychain-$(openssl rand -hex 8)"
            security create-keychain -p "${KEYCHAIN_PASS}" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "${KEYCHAIN_PASS}" build.keychain
            security set-keychain-settings -lut 3600 build.keychain
            security import certificate.p12 \
              -k build.keychain \
              -P "${CERT_PASSWORD}" \
              -T /usr/bin/codesign \
              -T /usr/bin/xcodebuild
            security set-key-partition-list \
              -S apple-tool:,apple: \
              -s -k "${KEYCHAIN_PASS}" build.keychain

            # ── Provisioning profile ─────────────────────────────────────────
            echo "${PROFILE_B64}" | base64 --decode > profile.mobileprovision
            PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
            mkdir -p "${PROFILES_DIR}"
            PROFILE_UUID=$(security cms -D -i profile.mobileprovision | \
              /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
            cp profile.mobileprovision "${PROFILES_DIR}/${PROFILE_UUID}.mobileprovision"

            # ── Archive ──────────────────────────────────────────────────────
            xcodebuild archive \
              -project TeamMaestroExam.xcodeproj \
              -scheme TeamMaestroExam \
              -sdk iphoneos \
              -configuration Release \
              -archivePath build/TeamMaestroExam.xcarchive \
              DEVELOPMENT_TEAM="${TEAM_ID}" \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}"

            # ── ExportOptions.plist ──────────────────────────────────────────
            cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

            xcodebuild -exportArchive \
              -archivePath build/TeamMaestroExam.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/export

            mv build/export/TeamMaestroExam.ipa "TeamMaestroExam-${VERSION}.ipa"

          else
            echo "==> Unsigned build (no signing secrets)"

            xcodebuild archive \
              -project TeamMaestroExam.xcodeproj \
              -scheme TeamMaestroExam \
              -sdk iphoneos \
              -configuration Release \
              -archivePath build/TeamMaestroExam.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO

            # Manually package the .app into a valid IPA structure
            APP_PATH=$(find build/TeamMaestroExam.xcarchive/Products -name "*.app" | head -1)
            mkdir -p Payload
            cp -r "${APP_PATH}" Payload/
            zip -r "TeamMaestroExam-${VERSION}.ipa" Payload
            rm -rf Payload
          fi

          echo "IPA ready: TeamMaestroExam-${VERSION}.ipa"
          ls -lh "TeamMaestroExam-${VERSION}.ipa"

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamMaestroExam-${{ steps.version.outputs.version }}
          path: TeamMaestroExam-${{ steps.version.outputs.version }}.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Team Maestro Exam ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: TeamMaestroExam-${{ steps.version.outputs.version }}.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
