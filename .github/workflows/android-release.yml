name: Android Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
      app_url:
        description: "Public web/PWA URL"
        required: true
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper
      - name: Restore permanent keystore
        run: echo "\${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: \${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PAPP_URL="\${{ inputs.app_url }}"
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \${{ inputs.tag }}
          files: android/app/build/outputs/apk/release/*.apk
